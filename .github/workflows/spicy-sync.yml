name: Auto-Sync Spicy Lyrics
on:
  schedule:
    - cron: '0 0 * * *' # Runs every midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Your Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Clone Official Spicy Lyrics
        shell: bash
        run: |
          git clone https://github.com/Spikerko/spicy-lyrics.git official-spicy-lyrics
          rm -rf official-spicy-lyrics/.git
          cp -r official-spicy-lyrics/* spicy-lyrics/
          cp official-spicy-lyrics/.* spicy-lyrics/ 2>/dev/null || true
          # Fix case sensitivity bug in official repository
          mv spicy-lyrics/src/utils/Logger.ts spicy-lyrics/src/utils/logger.ts || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install & Build Official Spicy Lyrics
        shell: bash
        run: |
          cd spicy-lyrics
          bun install
          bun pm trust --all || true
          bun install
          bun run build

      - name: Inject Beautiful Release Date (Auto-Patch)
        shell: bash
        run: |
          echo -e "\n;" >> spicy-lyrics/build/spicy-lyrics.js
          cat beautiful-release-date/extension-core.js >> spicy-lyrics/build/spicy-lyrics.js
          echo "console.log('Beautiful Release Date successfully injected into Spicy Lyrics!');" >> spicy-lyrics/build/spicy-lyrics.js
          
      - name: Commit and Push Custom Build
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spicy-lyrics/
          git commit -m "chore: auto-sync and build latest spicy lyrics with release date" || exit 0
          git push
